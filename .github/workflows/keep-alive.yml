name: Keep-Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API (open tenders)
        run: |
          curl -sf https://centralprocure.onrender.com/api/Tender/open || exit 1
          echo "API ping successful at $(date -u)"
