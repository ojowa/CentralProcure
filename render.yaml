databases:
  - name: centralprocure-db
    plan: free
    databaseName: NIS_EPROCUREMENT
    user: centralprocure

services:
  - type: web
    name: centralprocure-backend
    plan: free
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    buildFilter:
      paths:
        - Backend/**
        - Dockerfile
        - .dockerignore
        - render.yaml
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: ConnectionStrings__Primary
        fromDatabase:
          name: centralprocure-db
          property: connectionString
      - key: Security__PasswordPepper
        generateValue: true
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: nis-eproc-identity
      - key: Jwt__Audience
        value: nis-eproc-clients
