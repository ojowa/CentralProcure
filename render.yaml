services:
  - type: web
    name: centralprocure
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build --prefix apps/api
    startCommand: node apps/api/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: JWT_KEY
        sync: false
      - key: JWT_ISSUER
        value: nis-eproc-identity
      - key: JWT_AUDIENCE
        value: nis-eproc-clients
      - key: CORS_ALLOWED_ORIGINS
        sync: false
