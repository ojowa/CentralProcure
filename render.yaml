services:
  - type: web
    name: centralprocure-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_KEY
        sync: false
      - key: JWT_ISSUER
        value: nis-eproc-identity
      - key: JWT_AUDIENCE
        value: nis-eproc-clients
      - key: JWT_DURATION_MINUTES
        value: 1440

  - type: web
    name: centralprocure-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:web
    startCommand: npm run start -w @centralprocure/web
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://centralprocure-api.onrender.com
      - key: NEXT_PUBLIC_APP_BASE_PATH
        sync: false
