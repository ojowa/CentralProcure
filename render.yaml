services:
  # API - Express.js backend (Docker)
  - type: web
    name: centralprocure-backend
    runtime: docker
    plan: free
    rootDir: apps/api
    dockerfilePath: apps/api/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_KEY
        sync: false
      - key: JWT_ISSUER
        value: nis-eproc-identity
      - key: JWT_AUDIENCE
        value: nis-eproc-clients
      - key: JWT_DURATION_MINUTES
        value: "1440"
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # Frontend - Next.js (Node)
  - type: web
    name: centralprocure-frontend
    runtime: node
    plan: free
    rootDir: apps/Frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://centralprocure-backend.onrender.com
      - key: NEXT_PUBLIC_APP_BASE_PATH
        sync: false
