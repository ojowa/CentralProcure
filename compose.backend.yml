services:
  postgres:
    build:
      context: ./database_schema
      dockerfile: docker/postgres/Dockerfile
    container_name: centralprocure-postgres
    environment:
      POSTGRES_DB: NIS_EPROCUREMENT
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d NIS_EPROCUREMENT"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: centralprocure-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Primary: Host=postgres;Port=5432;Database=NIS_EPROCUREMENT;Username=postgres;Password=postgres
      Security__PasswordPepper: CHANGE_THIS_PEPPER
      Jwt__Key: CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS
      Jwt__Issuer: nis-eproc-identity
      Jwt__Audience: nis-eproc-clients
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
