services:
  - type: web
    name: eprocurement-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:web
    startCommand: npm run start -w @eprocurement/web
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_APP_BASE_PATH
        sync: false
